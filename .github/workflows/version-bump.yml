name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      prerelease_type:
        description: 'Pre-release type (if applicable)'
        required: false
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - rc

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11.x

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bump2version

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Get current version
      id: current_version
      run: |
        # Extract version from setup.py or __init__.py if they exist
        if [ -f "setup.py" ]; then
          CURRENT_VERSION=$(python setup.py --version 2>/dev/null || echo "0.1.0")
        elif [ -f "SecCodeSmithBackend/__init__.py" ]; then
          CURRENT_VERSION=$(grep -E "__version__" SecCodeSmithBackend/__init__.py | cut -d'"' -f2 || echo "0.1.0")
        else
          # Get latest tag or default to 0.1.0
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.1.0")
        fi
        echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT

    - name: Create version file if not exists
      run: |
        # Create a version file if it doesn't exist
        if [ ! -f "VERSION" ]; then
          echo "${{ steps.current_version.outputs.current }}" > VERSION
        fi

        # Create bump2version config
        cat > .bumpversion.cfg << 'EOF'
        [bumpversion]
        current_version = ${{ steps.current_version.outputs.current }}
        commit = True
        tag = True
        tag_name = v{new_version}

        [bumpversion:file:VERSION]

        [bumpversion:file:SecCodeSmithBackend/__init__.py]
        search = __version__ = "{current_version}"
        replace = __version__ = "{new_version}"

        [bumpversion:file:README.md]
        search = Version-{current_version}
        replace = Version-{new_version}
        EOF

    - name: Create __init__.py with version if not exists
      run: |
        if [ ! -f "SecCodeSmithBackend/__init__.py" ] || ! grep -q "__version__" SecCodeSmithBackend/__init__.py; then
          echo "__version__ = \"${{ steps.current_version.outputs.current }}\"" >> SecCodeSmithBackend/__init__.py
        fi

    - name: Bump version
      id: bump
      run: |
        VERSION_TYPE="${{ github.event.inputs.version_type }}"
        PRERELEASE_TYPE="${{ github.event.inputs.prerelease_type }}"

        # Handle prerelease versions
        if [[ "$VERSION_TYPE" == "prepatch" || "$VERSION_TYPE" == "preminor" || "$VERSION_TYPE" == "premajor" || "$VERSION_TYPE" == "prerelease" ]]; then
          if [ "$VERSION_TYPE" = "prerelease" ]; then
            bump2version prerelease --prerelease-prefix="$PRERELEASE_TYPE"
          else
            bump2version "$VERSION_TYPE" --prerelease-prefix="$PRERELEASE_TYPE"
          fi
        else
          bump2version "$VERSION_TYPE"
        fi

        NEW_VERSION=$(cat VERSION)
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        if [ -z "$LAST_TAG" ]; then
          COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges HEAD~10..HEAD)
        else
          COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges $LAST_TAG..HEAD~1)
        fi

        # Create/update CHANGELOG.md
        if [ ! -f "CHANGELOG.md" ]; then
          cat > CHANGELOG.md << 'EOF'
        # Changelog

        All notable changes to this project will be documented in this file.

        The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
        and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

        EOF
        fi

        # Add new version to changelog
        TEMP_FILE=$(mktemp)
        cat > "$TEMP_FILE" << EOF
        # Changelog

        All notable changes to this project will be documented in this file.

        The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
        and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

        ## [${{ steps.bump.outputs.new_version }}] - $(date +%Y-%m-%d)

        ### Added
        - New features and improvements

        ### Changed
        - Updates and modifications

        ### Fixed
        - Bug fixes and corrections

        ### Commits in this release:
        $COMMITS

        EOF

        # Append existing changelog content (skip the header)
        if [ -f "CHANGELOG.md" ]; then
          tail -n +8 CHANGELOG.md >> "$TEMP_FILE" 2>/dev/null || true
        fi

        mv "$TEMP_FILE" CHANGELOG.md

    - name: Commit changelog
      run: |
        git add CHANGELOG.md
        git commit --amend --no-edit

    - name: Push changes
      run: |
        git push origin HEAD:version-bump-${{ steps.bump.outputs.new_version }}
        git push origin v${{ steps.bump.outputs.new_version }}

    - name: Create Pull Request
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { data: pullRequest } = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `🔖 Version bump to ${{ steps.bump.outputs.new_version }}`,
            head: `version-bump-${{ steps.bump.outputs.new_version }}`,
            base: 'main',
            body: `## 🔖 Version Bump

            This PR bumps the version from **${{ steps.current_version.outputs.current }}** to **${{ steps.bump.outputs.new_version }}**.

            ### 📋 Changes:
            - ✅ Version updated in all relevant files
            - ✅ Changelog updated with latest changes
            - ✅ Git tag created: \`v${{ steps.bump.outputs.new_version }}\`

            ### 🔧 Bump Type:
            **${{ github.event.inputs.version_type }}**${github.event.inputs.prerelease_type ? ` (${github.event.inputs.prerelease_type})` : ''}

            ### 🚀 Next Steps:
            1. Review and merge this PR
            2. The release workflow will automatically trigger
            3. A new release will be created with artifacts

            ### 📝 Auto-generated files:
            - \`VERSION\`
            - \`CHANGELOG.md\`
            - \`SecCodeSmithBackend/__init__.py\`
            - \`README.md\` (version badge)

            ---
            *This PR was automatically created by the version bump workflow.*`
          });

          console.log(`Pull Request created: ${pullRequest.html_url}`);

    - name: Create release draft
      if: ${{ !contains(github.event.inputs.version_type, 'pre') }}
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.bump.outputs.new_version }}
        release_name: SecCodeSmith Backend v${{ steps.bump.outputs.new_version }}
        body: |
          ## 🚀 SecCodeSmith Backend v${{ steps.bump.outputs.new_version }}

          ### 📋 What's New:

          This release includes various improvements and updates to the SecCodeSmith Backend API.

          ### 🔧 Technical Details:
          - **Version**: ${{ steps.bump.outputs.new_version }}
          - **Previous Version**: ${{ steps.current_version.outputs.current }}
          - **Bump Type**: ${{ github.event.inputs.version_type }}

          ### 📖 Full Changelog:
          For detailed changes, see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

          ### 🚀 Quick Start:
          ```bash
          # Clone the repository
          git clone https://github.com/${{ github.repository }}.git
          cd SecCodeSmith-backend

          # Set up virtual environment
          python -m venv .venv
          source .venv/bin/activate  # On Windows: .venv\Scripts\activate

          # Install dependencies
          pip install -r requirements.txt

          # Run migrations and start server
          python manage.py migrate
          python manage.py runserver
          ```

          ---
          **Download**: See assets below for source code archives
        draft: true
        prerelease: false

    - name: Summary
      run: |
        echo "## 🎉 Version Bump Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Previous Version**: ${{ steps.current_version.outputs.current }}" >> $GITHUB_STEP_SUMMARY
        echo "- **New Version**: ${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Bump Type**: ${{ github.event.inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Tag Created**: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📝 Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "1. Review and merge the created Pull Request" >> $GITHUB_STEP_SUMMARY
        echo "2. The release workflow will automatically run" >> $GITHUB_STEP_SUMMARY
        echo "3. A new release will be published with artifacts" >> $GITHUB_STEP_SUMMARY
