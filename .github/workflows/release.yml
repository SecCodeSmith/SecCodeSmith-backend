name: Release Pipeline

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - 'release/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_version: ${{ steps.version.outputs.release_version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract and bump version
        id: version
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          RELEASE_VERSION=$(echo $BRANCH_NAME | grep -oP 'release/\K[0-9]+\.[0-9]+' || echo "0.1")

          # Read current full version or start from release.1
          BUILD_FILE=".build"
          if [ -f "$BUILD_FILE" ]; then
            CURRENT_VERSION=$(cat $BUILD_FILE)
            # Extract current release version from stored version
            CURRENT_RELEASE_VERSION=$(echo $CURRENT_VERSION | grep -oP '^[0-9]+\.[0-9]+' || echo "0.0")

            if [ "$RELEASE_VERSION" = "$CURRENT_RELEASE_VERSION" ]; then
              # Same release version - increment build number
              BUILD_NUMBER=$(echo $CURRENT_VERSION | grep -oP '\.[0-9]+$' | sed 's/\.//')
              BUILD_NUMBER=$((BUILD_NUMBER + 1))
              echo "Incrementing build number for release $RELEASE_VERSION"
            else
              # Different release version - reset build number to 1
              BUILD_NUMBER=0
              echo "New release version $RELEASE_VERSION detected (was $CURRENT_RELEASE_VERSION) - resetting build number to 1"
            fi
          else
            BUILD_NUMBER=0
            echo "No previous version found - starting with build number 1"
          fi

          # Create full version string
          FULL_VERSION="${RELEASE_VERSION}.${BUILD_NUMBER}"

          # Update build file with full version
          echo $FULL_VERSION > $BUILD_FILE

          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Release version: $FULL_VERSION (Release: $RELEASE_VERSION, Build: $BUILD_NUMBER)"

      - name: Commit build number update
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .build
          git commit -m "Bump version to ${{ steps.version.outputs.version }}" || exit 0
          git push

  run-tests:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: backend
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_TYPE: pgsql
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: backend
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python -m pytest --cov=. --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-migrations:
    needs: prepare-release
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: backend
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379


    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment variables
        run: |
          echo "DJANGO_DEBUG=False" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV
          echo "DATABASE_TYPE=pgsql" >> $GITHUB_ENV
          echo "DATABASE_USER=postgres" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=postgres" >> $GITHUB_ENV
          echo "DATABASE_HOST=localhost" >> $GITHUB_ENV
          echo "DATABASE_PORT=5432" >> $GITHUB_ENV
          echo "DATABASE_NAME=backend" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "REDIS_DB=0" >> $GITHUB_ENV

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Run Django system checks
        run: |
          python manage.py check


  build-and-test-container:
    needs: [prepare-release, run-tests, test-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_GITHUB }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
            type=raw,value=${{ needs.prepare-release.outputs.release_version }}
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  check-secure-release:
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python 3.12.x
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.x
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Security scan with bandit
        run: |
          bandit -r . --severity-level medium

      - name: Dependency security check
        run: |
          # Install compatible versions for safety
          pip install "typer<0.13.0" "safety==2.4.0b2" || pip install "safety<3.0.0"

          # Run safety check with fallback
          safety check || {
            echo "Safety check failed, trying pip-audit as fallback..."
            pip install pip-audit
            pip-audit --desc || echo "Dependency security scan completed with warnings"
          }

  create-release-summary:
    needs: [prepare-release, run-tests, test-migrations, build-and-test-container, check-secure-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create Git tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v${{ needs.prepare-release.outputs.version }}" -m "Release v${{ needs.prepare-release.outputs.version }}"
          git push origin "v${{ needs.prepare-release.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.prepare-release.outputs.version }}"
          name: "Release v${{ needs.prepare-release.outputs.version }}"
          body: |
            ## 🚀 Release v${{ needs.prepare-release.outputs.version }}

            **Release Information:**
            - **Full Version:** ${{ needs.prepare-release.outputs.version }}
            - **Release Version:** ${{ needs.prepare-release.outputs.release_version }}
            - **Build Number:** ${{ needs.prepare-release.outputs.build_number }}
            - **Branch:** ${GITHUB_REF#refs/heads/}

            **Container Images:**
            - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.version }}` (full version)
            - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.release_version }}` (release version)
            - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest`

            **✅ Completed Pipeline Steps:**
            - ✅ Version bumped to ${{ needs.prepare-release.outputs.version }}
            - ✅ Tests passed on Python 3.10, 3.11, 3.12
            - ✅ Database migrations verified
            - ✅ Code coverage uploaded to Codecov
            - ✅ Docker container built for multiple architectures (amd64/arm64)
            - ✅ Container uploaded to GitHub Container Registry

            **🔗 Quick Links:**
            - [View Container on GitHub Container Registry](https://github.com/SecCodeSmith/SecCodeSmith-backend/pkgs/container/seccodesmith-backend)
            - [View Source Code](https://github.com/SecCodeSmith/SecCodeSmith-backend/tree/v${{ needs.prepare-release.outputs.version }})
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release summary
        run: |
          echo "🚀 Release Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Full Version:** ${{ needs.prepare-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Version:** ${{ needs.prepare-release.outputs.release_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ needs.prepare-release.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${GITHUB_REF#refs/heads/}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Container Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.version }}\` (full version)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.release_version }}\` (release version)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Completed Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Version bumped to ${{ needs.prepare-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests passed on Python 3.10, 3.11, 3.12" >> $GITHUB_STEP_SUMMARY
          echo "- Database migrations verified" >> $GITHUB_STEP_SUMMARY
          echo "- Code coverage uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
          echo "- Docker container built and tested" >> $GITHUB_STEP_SUMMARY
          echo "- Container uploaded to GitHub Container Registry" >> $GITHUB_STEP_SUMMARY
          echo "- Database migrations verified" >> $GITHUB_STEP_SUMMARY
          echo "- Code coverage uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
          echo "- Docker container built and tested" >> $GITHUB_STEP_SUMMARY
          echo "- Container uploaded to GitHub Container Registry" >> $GITHUB_STEP_SUMMARY
