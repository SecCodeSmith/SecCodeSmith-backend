[pytest]
DJANGO_SETTINGS_MODULE = SecCodeSmithBackend.settings
python_files = test.py test_*.py *_tests.py tests.py
python_classes = Test* *Tests *TestCase !Testimonials
addopts = --strict-markers --strict-config --verbose --tb=short --reuse-db
testpaths = api BlogApi ProjectApi Images
filterwarnings =
    ignore::pytest.PytestCollectionWarning
    ignore::UserWarning
    ignore::RuntimeWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
