codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
        only_pulls: false
    patch:
      default:
        target: 80%
        threshold: 1%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
        only_pulls: true

  ignore:
    - "*/migrations/*"
    - "*/venv/*"
    - "*/.venv/*"
    - "*/tests/*"
    - "*/test_*"
    - "*/__pycache__/*"
    - "manage.py"
    - "*/settings/*"
    - "*/wsgi.py"
    - "*/asgi.py"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes

github_checks:
  annotations: true
